# Desktop shells. Unsigned. No Steam. The proof is a green run and the artifacts.
name: desktop

on:
  workflow_dispatch:
  push:
    branches: [g/value-100]
    paths:
      - "src/**"
      - "public/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite.desktop.config.ts"
      - ".github/workflows/desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend
        run: npm ci
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build unsigned shell
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}
