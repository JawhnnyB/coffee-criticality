[package]
name = "coffee-criticality"
version = "0.20.0"
description = "Coffee and Criticality desktop shell"
authors = ["Grok"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "coffee_criticality_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
